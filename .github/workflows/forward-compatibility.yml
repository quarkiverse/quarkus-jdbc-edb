name: Quarkus forward compatibility

# The extension is compiled against the oldest supported Quarkus LTS, because the extension registry
# builds a catalog per Quarkus version and selects extensions by their built-with version -- so
# building against a newer core makes us invisible to everyone on an older one. See the note on
# quarkus.version in the root pom.
#
# The cost of that choice is the risk this workflow covers: most users are on a much newer core, and
# nothing else proves the extension still works there. The ecosystem CI workflow builds against
# Quarkus main, which is a different question from the current release.
#
# Kept out of build.yml on purpose. That file follows the Quarkiverse template and is periodically
# updated in bulk across repositories; a rewrite of it must not be able to drop this check.

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  forward-compatibility:
    name: Build an application on the newest Quarkus release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Install the extension
        # The extension only; its integration tests are covered by the Build workflow. Installing it
        # here rather than reusing that workflow's output keeps the two independent, so a failure
        # points at one thing.
        run: mvn -B install -Dno-format -DskipTests -pl runtime,deployment -am

      - name: Build an application on the newest Quarkus release
        # Version pinned in forward-compatibility/pom.xml, which is deliberately neither a module of
        # the root pom nor a child of its parent -- inheriting either would resolve the LTS we compile
        # against while appearing to test the newest release.
        run: mvn -B -f forward-compatibility verify
