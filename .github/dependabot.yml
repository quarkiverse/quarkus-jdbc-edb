# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    ignore:
      # quarkus.version is pinned to the LOWEST patch of the oldest supported Quarkus LTS on purpose
      # -- see the note on that property in the root pom. The extension registry selects, per Quarkus
      # version, the newest release whose built-with-quarkus-core is at or below it, so ANY increase
      # removes the extension from the catalogs of every earlier version. Bumping 3.40.0 to 3.40.1
      # would drop us from the 3.40.0 catalog, and quite possibly the version a customer runs.
      #
      # This is the 3.40 LTS line (main, 1.3.x+). The 3.33 LTS line has its own pin and its own copy
      # of this rule on the 1.2.x branch -- do not merge that branch's dependabot.yml into this one.
      #
      # So no update type is safe here, patch included. This is not a semver compatibility question,
      # which is why the usual "patches are harmless" reasoning does not apply -- an earlier version
      # of this rule allowed patch updates and Dependabot immediately proposed exactly that bump.
      # Nothing in CI would catch it: the build would be green and the extension simply invisible.
      #
      # Raise the pin only as a deliberate decision, together with requiresQuarkusCore in
      # runtime/pom.xml, accepting that users on older patches lose access to new releases.
      - dependency-name: "io.quarkus:*"
      - dependency-name: "io.quarkus.platform:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily