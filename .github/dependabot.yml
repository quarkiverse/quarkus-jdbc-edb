# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    ignore:
      # quarkus.version is pinned to the oldest supported LTS on purpose -- see the note on that
      # property in the root pom. An extension built against a newer core is invisible in the
      # extension catalogs of every older one, so bumping this silently removes us from the LTS
      # users we most want to reach. It has happened before: PR #6 moved us to 3.38.2 this way.
      #
      # Patch updates within the pinned LTS stream are still welcome, so only major and minor
      # updates are ignored.
      - dependency-name: "io.quarkus:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "io.quarkus.platform:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily