# No database is started for this check. The datasource is configured but never asked for a
# connection, because Agroal creates its pool lazily -- the assertions read configuration only.
#
# What is being verified is that the extension's build steps run during augmentation, and that its
# runtime configurer is resolved, against the Quarkus version pinned in this project's pom.
quarkus.datasource.db-kind=edb
quarkus.datasource.jdbc.url=jdbc:edb://localhost:5444/edb
quarkus.datasource.username=enterprisedb
quarkus.datasource.password=enterprisedb
