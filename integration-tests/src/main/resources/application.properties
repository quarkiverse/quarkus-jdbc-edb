# The JDBC URL, username and password are supplied at test time by EdbDatabaseTestResource:
# a community PostgreSQL container by default, or the edb.jdbc.* system properties with -Pepas.
quarkus.datasource.db-kind=edb

# A second, named datasource, so that coverage includes datasources other than the default one --
# including in native mode, where this build-time configuration is baked into the image and cannot be
# supplied by a test profile or a test resource. Its URL and credentials come from
# EdbDatabaseTestResource, which points it at the same database as the default datasource.
quarkus.datasource."secondary".db-kind=edb

# A third datasource using XA transactions, which reaches the database through
# com.edb.xa.PGXADataSource rather than through the driver directly. Agroal configures an XA
# datasource by JavaBean introspection instead of by handing the URL to the driver, so this is the
# only configuration under which the extension's reflection registration is load-bearing -- and it
# only matters in native mode. Both of these keys are build-time, hence application.properties: a
# native image bakes them in and no test resource or profile can supply them.
quarkus.datasource."xa".db-kind=edb
quarkus.datasource."xa".jdbc.transactions=xa

# Datasources for the two migration tools. Each gets its own so that migrations never run against the
# datasources the other tests use, and so the tools cannot interfere with each other -- they have
# conflicting requirements against EPAS, which is the point of keeping them apart.
quarkus.datasource."flyway".db-kind=edb
quarkus.datasource."liquibase".db-kind=edb

quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Flyway. `enabled` is build-time, which is why this cannot be switched on by a test profile the way
# it used to be: a native image bakes it in. Only the flyway datasource migrates at start, so turning
# it on globally costs nothing for the others.
quarkus.flyway.enabled=true
quarkus.flyway."flyway".migrate-at-start=true
# Flyway refuses to migrate a non-empty schema without a history table, and Hibernate's
# drop-and-create has already populated the default one. Giving Flyway a schema of its own avoids
# that collision outright -- no baseline-on-migrate workaround needed -- and confines clean-at-start
# to objects this test owns, which is what makes the test re-runnable against a persistent EPAS
# instance rather than silently becoming a no-op on its second run.
quarkus.flyway."flyway".default-schema=probe_flyway
quarkus.flyway."flyway".create-schemas=true
quarkus.flyway."flyway".clean-disabled=false
quarkus.flyway."flyway".clean-at-start=true

# Liquibase. Unlike Flyway it tolerates a schema that already holds other tables, so it needs no
# schema of its own. It is deliberately left without `changeServerName=true` on its URL: Liquibase
# ships an EnterpriseDB implementation and selects it from the reported product name, and that flag
# would make it fall back to the generic PostgreSQL one. See EdbDatabaseTestResource.
quarkus.liquibase."liquibase".migrate-at-start=true
